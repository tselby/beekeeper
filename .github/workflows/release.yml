# Publishes a GitHub Release whenever main has a manifest.json version that hasn't been
# released yet. To release: bump "version" in manifest.json and push to main.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.version.outputs.exists != 'true'
        run: npm test

      - name: Package
        if: steps.version.outputs.exists != 'true'
        run: |
          mkdir -p build/beekeeper
          cp -r manifest.json src icons LICENSE build/beekeeper/
          cd build && zip -r "beekeeper-${{ steps.version.outputs.tag }}.zip" beekeeper

      - name: Publish release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "build/beekeeper-${{ steps.version.outputs.tag }}.zip" \
            --target "$GITHUB_SHA" \
            --title "Bee Keeper ${{ steps.version.outputs.tag }}" \
            --generate-notes
